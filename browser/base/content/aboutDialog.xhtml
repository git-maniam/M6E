<?csp default-src chrome: resource:; object-src 'none'; ?>

<window xmlns:html="http://www.w3.org/1999/xhtml"
        xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        id="aboutDialog"
        windowtype="Browser:About"
        role="dialog"
        aria-describedby="version distribution distributionId m6eWelcome m6eExperimental m6eAttribution trademark"
        >
#include macWindow.inc.xhtml

  <linkset>
    <html:link rel="stylesheet" href="chrome://global/skin/global.css" />
    <html:link
      rel="stylesheet"
      href="chrome://browser/content/aboutDialog.css"
    />
    <html:link
      rel="stylesheet"
      href="chrome://branding/content/aboutDialog.css"
    />

    <html:link rel="localization" href="branding/brand.ftl"/>
    <html:link rel="localization" href="browser/aboutDialog.ftl"/>
  </linkset>

  <html:div id="aboutDialogContainer">
    <hbox id="clientBox">
      <vbox id="leftBox" flex="1"/>
      <vbox id="rightBox">
        <label id="release" hidden="true">
        <!-- This string is explicitly not translated -->
          Extended Support Release
        </label>
        <hbox align="baseline">
          <label id="version"/>
          <label id="releasenotes" is="text-link" hidden="true" data-l10n-id="releaseNotes-link"/>
        </hbox>

        <label id="distribution" class="text-blurb"/>
        <label id="distributionId" class="text-blurb"/>

        <vbox id="detailsBox">
          <vbox id="experimental" hidden="true"/>
          <description class="text-blurb" id="communityDesc" hidden="true"/>
          <description class="text-blurb" id="m6eWelcome" data-l10n-id="aboutdialog-m6e-welcome"/>
          <description class="text-blurb" id="m6eExperimental" data-l10n-id="aboutdialog-m6e-experimental"/>
          <description class="text-blurb" id="m6eAttribution" data-l10n-id="aboutdialog-m6e-based-on">
            <label is="text-link" useoriginprincipal="true" href="about:license" data-l10n-name="license-link"/>
          </description>

        </vbox>
      </vbox>
    </hbox>
    <vbox id="bottomBox">
      <hbox pack="center">
        <label is="text-link" class="bottom-link" useoriginprincipal="true" href="about:license" data-l10n-id="bottomLinks-license"/>
      </hbox>
      <description id="trademark" data-l10n-id="trademarkInfo"></description>
    </vbox>
  </html:div>

  <keyset>
    <key id="aboutDialogEscapeKey" keycode="VK_ESCAPE"/>
  </keyset>

  <script src="chrome://browser/content/aboutDialog.js"/>
</window>
