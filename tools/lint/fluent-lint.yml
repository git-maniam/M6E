---
fluent-lint:
    description: Linter for Fluent files
    exclude:
        - browser/extensions/newtab/webext-glue/locales/
        - dom/l10n/tests/mochitest/document_l10n/non-system-principal/localization/test.ftl
    extensions: ['ftl']
    support-files:
        - 'tools/lint/fluent-lint**'
    brand-files:
        - 'browser/branding/m6e/locales/en-US/brand.ftl'
        - 'toolkit/locales/en-US/toolkit/branding/brandings.ftl'
    # Terms in brandings.ftl whose M6E value is an ordinary word.
    generic-names:
        - Monitor
        - Profiler
        - Relay
        - Screenshots
        - Send
        - Solo
        - Translations
        - VPN
    type: external
    payload: fluent-lint:lint
