---
glean-parser:
    description: |
        Lints Glean telemetry configuration files (metrics.yaml and pings.yaml)
        using the glean_parser's built-in linter.
    include:
        - .
    exclude:
        # Merged into generated_metrics.yaml by glean_metrics.py.
        - toolkit/crashreporter/crashping/static_metrics.yaml
    extensions:
        - yaml
    support-files:
        - 'tools/lint/glean-parser/**'
    type: global
    payload: glean-parser:lint
